name: CD

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Тег release-<полный SHA>; пусто — последний опубликованный выпуск по истории main'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
  deployments: write

env:
  SITE_URL: https://cellestial.ru

jobs:
  cd:
    name: CD
    if: github.repository == 'Cringe-Driven-Development-Team/frontend' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
      deployments: write
    # ограничения environment production сохраняются; запись Deployment скрипт создаёт сам
    environment:
      name: production
      deployment: false
    # общая очередь публикации, CD, Rollback и issues.closed
    concurrency:
      group: release-board
      cancel-in-progress: false
      queue: max
    # SHA — выбранного Release, а не workflow: его выставляет шаг artifacts
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CDN_URL: ${{ vars.CDN_URL }}
      ANSIBLE_HOST_KEY_CHECKING: 'True'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # до доступа к VPS: published immutable Release, тег, комплект, суммы, manifest и источник
      - name: Ready release
        id: artifacts
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          bun run release artifacts "$RELEASE"
      - name: Last confirmed release
        id: confirmed
        run: bun run release confirmed
      # до изменения сервера: направление, образ анонимно, ассеты с CDN
      - name: Check release direction
        id: direction
        env:
          RELEASE_BEFORE_SHA: ${{ steps.confirmed.outputs.before_sha }}
        run: bun run release direction deploy "$SHA"
      - name: Anonymous image check
        id: image
        env:
          IMAGE_REF: ${{ steps.artifacts.outputs.image_ref }}
        run: bun run release image "$IMAGE_REF" "$SHA"
      - name: Release check
        id: check
        run: bun run release check "$SHA"
      - name: Checkout deployment infrastructure
        uses: actions/checkout@v5
        with:
          repository: Cringe-Driven-Development-Team/infra
          ref: main
          path: infra
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install deployment tools
        working-directory: infra/ansible
        run: |
          python -m pip install -r deploy-requirements.txt
          ansible-galaxy collection install -r deploy-requirements.yml
      - name: Prepare SSH and Vault files
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          for name in DEPLOY_SSH_KEY SSH_KNOWN_HOSTS ANSIBLE_VAULT_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::Нет секрета $name в environment production"; exit 1; }
          done
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy/ci-key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy/known_hosts"
          printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$RUNNER_TEMP/deploy/vault-pass"
          ssh-keygen -F cellestial.ru -f "$RUNNER_TEMP/deploy/known_hosts" > /dev/null
          echo "ANSIBLE_VAULT_PASSWORD_FILE=$RUNNER_TEMP/deploy/vault-pass" >> "$GITHUB_ENV"
      - name: Release report
        id: report
        env:
          RELEASE_REPORT_FILE: ${{ runner.temp }}/release-report.json
          RELEASE_BEFORE_SHA: ${{ steps.confirmed.outputs.before_sha }}
        run: bun run release report deploy "$SHA"
      - name: Production record
        id: start
        env:
          RELEASE_REPORT_BASE_SHA: ${{ steps.report.outputs.report_base_sha }}
          RELEASE_REPORT_URL: ${{ steps.report.outputs.report_url }}
          IMAGE_REF: ${{ steps.artifacts.outputs.image_ref }}
          RELEASE_ID: ${{ steps.artifacts.outputs.release_id }}
        run: bun run release start "$SHA" "$IMAGE_REF" deploy
      - name: Switch BFF
        id: switch
        working-directory: infra/ansible
        env:
          IMAGE_REF: ${{ steps.artifacts.outputs.image_ref }}
        run: |
          ansible-playbook -i inventory/ci.yml deploy-bff.yml \
            -e "bff_image_ref=$IMAGE_REF" -e "bff_release_sha=$SHA" \
            -e "deploy_key_path=$RUNNER_TEMP/deploy/ci-key" \
            --ssh-common-args="-o UserKnownHostsFile=$RUNNER_TEMP/deploy/known_hosts -o StrictHostKeyChecking=yes"
      - name: Remove deployment secrets
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy"
      - name: Health check
        id: health
        run: bun run release health "$SHA"
      # success — только после проверок запущенного выпуска; сбой до проверки — error
      - name: Production result
        id: finish
        if: always() && steps.start.outputs.deployment_id
        env:
          ID: ${{ steps.start.outputs.deployment_id }}
          RESULT: ${{ steps.health.outcome == 'success' && 'success' || (steps.switch.outcome == 'success' && 'failure' || 'error') }}
        run: bun run release finish "$ID" "$RESULT"
      - name: Update release issues
        id: board
        if: "!cancelled() && steps.health.outcome == 'success' && steps.finish.outcome == 'success'"
        env:
          ADD_TO_PROJECT_PAT: ${{ secrets.ADD_TO_PROJECT_PAT }}
          RELEASE_DEPLOYMENT_ID: ${{ steps.start.outputs.deployment_id }}
          RELEASE_REPORT_FILE: ${{ runner.temp }}/release-report.json
        run: bun run release board deploy "$SHA"
      - name: Retention
        if: "!cancelled() && steps.health.outcome == 'success' && steps.finish.outcome == 'success'"
        id: retention
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: bun run release retention
