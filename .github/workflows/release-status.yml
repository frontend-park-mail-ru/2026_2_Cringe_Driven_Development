name: Release status

on:
  workflow_run:
    workflows: [CI, CD, Rollback]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  board:
    name: Board
    if: github.repository == 'Cringe-Driven-Development-Team/frontend' && github.ref == 'refs/heads/main' && vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-board
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
      deployments: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ADD_TO_PROJECT_PAT: ${{ secrets.ADD_TO_PROJECT_PAT }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Reconcile board
        run: bun run release sync
