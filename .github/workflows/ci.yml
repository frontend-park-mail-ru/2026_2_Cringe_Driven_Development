name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# у кандидатов Merge Queue отдельные группы по ref; новый коммит PR отменяет только его старую проверку.
# В main идущий запуск не отменяется, но очереди нет: группа держит один ожидающий запуск, более
# новый push его вытесняет, и релиз вытесненного коммита не заливается. Это допустимо — поздний
# коммит включает ранний, выкатывают его
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      # настоящая сборка: COPY проверяет файлы контекста; образ остаётся на runner
      - name: Build BFF image
        run: docker build -f apps/bff/Dockerfile -t cdd-bff:ci .

  # Готовый выпуск коммита main: ассеты клиента в S3/CDN releases/<sha>/ и публичный образ BFF в GHCR
  # с HTML того же коммита. GitHub Release release-<sha> публикуется только после проверки обоих;
  # на прод выпуск выкатывает workflow CD по тегу Release (docs/release.md).
  publish:
    name: Publish release
    needs: check
    if: github.repository == 'Cringe-Driven-Development-Team/frontend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # contents: write — только здесь: draft, assets и publish Release через GITHUB_TOKEN
    permissions:
      contents: write
      actions: read
      packages: write
      pull-requests: read
      issues: read
    # ключ S3 лежит в environment и действует на весь проект Selectel. Публикация — не выкатка:
    # автоматический Deployment production не создаётся
    environment:
      name: production
      deployment: false
    # публикация, CD, Rollback и issues.closed выполняются в общей очереди
    concurrency:
      group: release-board
      cancel-in-progress: false
      queue: max
    env:
      SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
      CDN_URL: ${{ vars.CDN_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Published already
        id: published
        run: bun run release published "$SHA"
      # build=false и у незавершённого draft: его состав уже зафиксирован, сборка не повторяется
      - name: Build release
        if: steps.published.outputs.build == 'true'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          [ -n "$CDN_URL" ] || { echo "::error::Не задана переменная CDN_URL"; exit 1; }
          bun run build
      - name: Upload assets
        if: steps.published.outputs.build == 'true'
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: bun run release upload "$SHA"
      - name: Release check
        if: steps.published.outputs.published != 'true'
        run: bun run release check "$SHA"
      # образ — после обеих сборок (bff.js и index.html этого SHA), вне turbo build
      - name: Publish BFF image
        id: image
        if: steps.published.outputs.build == 'true'
        env:
          IMAGE: ghcr.io/cringe-driven-development-team/bff
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker build -f apps/bff/Dockerfile --build-arg "RELEASE_SHA=$SHA" -t "$IMAGE:sha-$SHA" .
          docker push "$IMAGE:sha-$SHA"
          ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$SHA")
          [[ "$ref" =~ ^ghcr\.io/cringe-driven-development-team/bff@sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::Не удалось получить digest образа: '$ref'"; exit 1; }
          echo "image_ref=$ref" >> "$GITHUB_OUTPUT"
      # без учётных данных, как скачивает VPS: приватный package — выпуск не готов
      - name: Anonymous image check
        if: steps.published.outputs.published != 'true'
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref || steps.published.outputs.image_ref }}
        run: bun run release image "$IMAGE_REF" "$SHA"
      - name: Release report
        id: report
        if: steps.published.outputs.published != 'true'
        env:
          RELEASE_REPORT_FILE: ${{ runner.temp }}/release-report.json
        run: bun run release report publish "$SHA"
      # draft → assets → publish; клиент draft без локального dist берётся из S3, образ — по digest
      - name: Register release
        id: register
        if: steps.published.outputs.published != 'true'
        env:
          RELEASE_REPORT_FILE: ${{ runner.temp }}/release-report.json
          RELEASE_REPORT_BASE_SHA: ${{ steps.report.outputs.report_base_sha }}
          RELEASE_REPORT_URL: ${{ steps.report.outputs.report_url }}
          IMAGE_REF: ${{ steps.image.outputs.image_ref || steps.published.outputs.image_ref }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: bun run release register "$SHA" "$IMAGE_REF"
      - name: Update release issues
        id: board
        if: "!cancelled() && steps.register.outcome == 'success' && steps.published.outputs.published != 'true'"
        env:
          ADD_TO_PROJECT_PAT: ${{ secrets.ADD_TO_PROJECT_PAT }}
          RELEASE_REPORT_FILE: ${{ runner.temp }}/release-report.json
        run: bun run release board publish "$SHA"

  course-sync:
    needs: [check]
    if: github.repository == 'Cringe-Driven-Development-Team/frontend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: Cringe-Driven-Development-Team/.github/.github/workflows/sync-to-course.yml@main
    with:
      sha: ${{ github.sha }}
      ci_run_id: ${{ format('{0}', github.run_id) }}
      automation_ref: main
    secrets:
      COURSE_SYNC_SSH_KEY: ${{ secrets.COURSE_SYNC_SSH_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
