name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# в PR новый коммит отменяет проверку старого. В main идущий запуск не отменяется, но очереди нет:
# группа держит один ожидающий запуск, более новый push его вытесняет, и релиз вытесненного коммита
# не заливается. Это допустимо — поздний коммит включает ранний, выкатывают его
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_URL: https://cellestial.ru

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  upload:
    name: Upload release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # ключ S3 лежит в environment и действует на весь проект Selectel
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - name: Build release
        env:
          RELEASE_SHA: ${{ github.sha }}
          CDN_URL: ${{ vars.CDN_URL }}
        run: |
          [ -n "$CDN_URL" ] || { echo "::error::Не задана переменная CDN_URL"; exit 1; }
          bun run build
      - name: Upload release
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: bun run release upload "$GITHUB_SHA"
      # релиз залит и отдаётся с CDN, но пользователи его не видят: выкатка — workflow CD
      - name: Release check
        env:
          CDN_URL: ${{ vars.CDN_URL }}
        run: bun run release check "$GITHUB_SHA"
      - name: Send to tg
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ vars.TELEGRAM_TOPIC_ID }}
        run: bun run release notify Заливка success "$GITHUB_SHA"
      - name: Send failure to tg
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ vars.TELEGRAM_TOPIC_ID }}
        run: bun run release notify Заливка failure "$GITHUB_SHA"
