name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# в PR новый коммит отменяет проверку старого; запуски main идут по очереди и не отменяются,
# чтобы релизы выкатывались в порядке коммитов
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_URL: https://cellestial.ru

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  upload:
    name: Upload release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # ключ S3 лежит в environment и действует на весь проект Selectel
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - name: Build release
        env:
          RELEASE_SHA: ${{ github.sha }}
          CDN_URL: ${{ vars.CDN_URL }}
        run: |
          [ -n "$CDN_URL" ] || { echo "::error::Не задана переменная CDN_URL"; exit 1; }
          bun run build
      - name: Upload release
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: .github/scripts/release.sh upload "$GITHUB_SHA"
      - name: Send to tg
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ vars.TELEGRAM_TOPIC_ID }}
        run: .github/scripts/release.sh notify Выкатка failure "$GITHUB_SHA"

  cd:
    name: CD
    needs: upload
    runs-on: ubuntu-latest
    environment: production
    # общая очередь с Rollback: указатель релиза меняет кто-то один
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      CDN_URL: ${{ vars.CDN_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Promote to stable
        run: .github/scripts/release.sh promote "$GITHUB_SHA"
      - name: Health check
        run: .github/scripts/release.sh health "$GITHUB_SHA"
      - name: Retention
        run: .github/scripts/release.sh retention
      - name: Send to tg
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ vars.TELEGRAM_TOPIC_ID }}
          STATUS: ${{ job.status }}
        run: .github/scripts/release.sh notify Выкатка "$STATUS" "$GITHUB_SHA"
