name: Release import

# Разовый перенос в GitHub Releases последнего подтверждённого production и предыдущего успешного
# выпуска с другим digest (docs/release.md, «Импорт»). Повторный запуск проверяет и пропускает
# уже опубликованные Releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    name: Release import
    if: github.repository == 'Cringe-Driven-Development-Team/frontend' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      deployments: read
      actions: read
    # ключ S3: клиент переносимых выпусков берётся из сохранённого releases/<sha>/
    environment:
      name: production
      deployment: false
    concurrency:
      group: release-board
      cancel-in-progress: false
      queue: max
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CDN_URL: ${{ vars.CDN_URL }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Import releases
        run: bun run release import
