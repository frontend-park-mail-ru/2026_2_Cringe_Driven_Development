name: Rollback

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  deployments: write

env:
  SITE_URL: https://cellestial.ru
  # entrypoint выкатки BFF (infra#74) на зафиксированной ревизии infra — та же, что в CD
  INFRA_REF: ae597f80bf0fcc0dbd8daa243cc61292c9760397

jobs:
  rollback:
    name: Rollback
    if: github.repository == 'Cringe-Driven-Development-Team/frontend' && github.ref == 'refs/heads/main' && vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      deployment: false
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CDN_URL: ${{ vars.CDN_URL }}
      ANSIBLE_HOST_KEY_CHECKING: 'True'
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # цель — по истории production в GitHub, до доступа к VPS (docs/release.md, «Откат»)
      - name: Rollback target
        id: target
        run: bun run release target
      - name: Anonymous image check
        id: image
        env:
          SHA: ${{ steps.target.outputs.sha }}
          IMAGE_REF: ${{ steps.target.outputs.image_ref }}
        run: bun run release image "$IMAGE_REF" "$SHA"
      - name: Release check
        id: check
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: bun run release check "$SHA"
      - name: Checkout deployment infrastructure
        uses: actions/checkout@v5
        with:
          repository: Cringe-Driven-Development-Team/infra
          ref: ${{ env.INFRA_REF }}
          path: infra
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install deployment tools
        working-directory: infra/ansible
        run: |
          python -m pip install -r deploy-requirements.txt
          ansible-galaxy collection install -r deploy-requirements.yml
      - name: Prepare SSH and Vault files
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          for name in DEPLOY_SSH_KEY SSH_KNOWN_HOSTS ANSIBLE_VAULT_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::Нет секрета $name в environment production"; exit 1; }
          done
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy/ci-key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy/known_hosts"
          printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$RUNNER_TEMP/deploy/vault-pass"
          ssh-keygen -F cellestial.ru -f "$RUNNER_TEMP/deploy/known_hosts" > /dev/null
          echo "ANSIBLE_VAULT_PASSWORD_FILE=$RUNNER_TEMP/deploy/vault-pass" >> "$GITHUB_ENV"
      # тот же entrypoint, что у выкатки: отсутствующий или упавший контейнер откат не блокирует
      - name: Release report
        id: report
        env:
          RELEASE_BEFORE_SHA: ${{ steps.target.outputs.before_sha }}
          SHA: ${{ steps.target.outputs.sha }}
        run: bun run release report rollback "$SHA"
      - name: Production record
        id: start
        env:
          RELEASE_REPORT_BASE_SHA: ${{ steps.report.outputs.report_base_sha }}
          RELEASE_REPORT_URL: ${{ steps.report.outputs.report_url }}
          SHA: ${{ steps.target.outputs.sha }}
          IMAGE_REF: ${{ steps.target.outputs.image_ref }}
        run: bun run release start "$SHA" "$IMAGE_REF" rollback
      - name: Switch BFF
        id: switch
        working-directory: infra/ansible
        env:
          SHA: ${{ steps.target.outputs.sha }}
          IMAGE_REF: ${{ steps.target.outputs.image_ref }}
        run: |
          ansible-playbook -i inventory/ci.yml deploy-bff.yml \
            -e "bff_image_ref=$IMAGE_REF" -e "bff_release_sha=$SHA" \
            -e "deploy_key_path=$RUNNER_TEMP/deploy/ci-key" \
            --ssh-common-args="-o UserKnownHostsFile=$RUNNER_TEMP/deploy/known_hosts -o StrictHostKeyChecking=yes"
      - name: Remove deployment secrets
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy"
      - name: Health check
        id: health
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: bun run release health "$SHA"
      - name: Production result
        if: always() && steps.start.outputs.deployment_id
        env:
          ID: ${{ steps.start.outputs.deployment_id }}
          RESULT: ${{ steps.health.outcome == 'success' && 'success' || (steps.switch.outcome == 'success' && 'failure' || 'error') }}
        run: bun run release finish "$ID" "$RESULT"
