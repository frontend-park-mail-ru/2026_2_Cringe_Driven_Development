name: Rollback

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: https://cellestial.ru

jobs:
  rollback:
    name: Rollback
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # общая очередь с CD: указатель релиза меняет кто-то один
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      CDN_URL: ${{ vars.CDN_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Switch release pointer
        id: switch
        run: .github/scripts/release.sh rollback
      - name: Health check
        env:
          SHA: ${{ steps.switch.outputs.sha }}
        run: .github/scripts/release.sh health "$SHA"
      - name: Send to tg
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ vars.TELEGRAM_TOPIC_ID }}
          STATUS: ${{ job.status }}
          SHA: ${{ steps.switch.outputs.sha }}
        run: .github/scripts/release.sh notify Откат "$STATUS" "$SHA"
