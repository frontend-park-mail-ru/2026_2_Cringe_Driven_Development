name: Rollback

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: https://cellestial.ru

jobs:
  rollback:
    name: Rollback
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # указатель релиза меняет кто-то один: группа общая с CD. Очереди в ней нет — ожидает
    # один запуск, более новый его вытесняет (README, «Выкатка»)
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      CDN_URL: ${{ vars.CDN_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - name: Find previous release
        id: previous
        run: bun run release previous
      # как и в выкатке, релиз проверяется до переключения
      - name: Release check
        env:
          SHA: ${{ steps.previous.outputs.sha }}
        run: bun run release check "$SHA"
      - name: Switch release pointer
        env:
          SHA: ${{ steps.previous.outputs.sha }}
        run: bun run release rollback "$SHA"
      - name: Health check
        env:
          SHA: ${{ steps.previous.outputs.sha }}
        run: bun run release health "$SHA"
      - name: Send to tg
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ vars.TELEGRAM_TOPIC_ID }}
          STATUS: ${{ job.status }}
          SHA: ${{ steps.previous.outputs.sha }}
        run: bun run release notify Откат "$STATUS" "$SHA"
