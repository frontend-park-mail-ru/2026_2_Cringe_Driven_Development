# Локальный запуск BFF из образа (docs/local-development.md, «BFF»). Go — по явному GO_API_URL с
# префиксом API; BFF_KEY — если Go проверяет X-BFF-Key:
#   bun run image
#   SESSION_KEY=$(openssl rand -base64 32) GO_API_URL=http://host.docker.internal:8080/api/v1 \
#     docker compose -f apps/bff/compose.yml up -d
name: cdd-bff

services:
    bff:
        image: cdd-bff:local
        environment:
            SESSION_KEY: ${SESSION_KEY:?SESSION_KEY is required, e.g. openssl rand -base64 32}
            APP_ORIGIN: http://localhost:3000
            GO_API_URL: ${GO_API_URL:?GO_API_URL is required, e.g. http://host.docker.internal:8080/api/v1}
            BFF_KEY: ${BFF_KEY:-}
        # host.docker.internal на Linux — Go на хосте
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '127.0.0.1:3000:3000'
        stop_grace_period: 15s
