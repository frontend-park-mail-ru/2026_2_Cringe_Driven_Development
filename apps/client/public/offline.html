<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="dark" />
        <title>Нет подключения — Cellestial</title>
        <link rel="stylesheet" href="/offline.css" />
    </head>
    <body>
        <div class="space" aria-hidden="true">
            <div class="stars"></div>
            <div class="planet"></div>
        </div>
        <header class="header">
            <span class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <defs>
                        <mask
                            id="offline-planet-cut"
                            maskUnits="userSpaceOnUse"
                            x="0"
                            y="0"
                            width="24"
                            height="24"
                        >
                            <rect width="24" height="24" fill="white" />
                            <path
                                d="M2.2 12 A9.8 3.6 0 0 0 21.8 12"
                                fill="none"
                                stroke="black"
                                stroke-width="3.2"
                            />
                        </mask>
                    </defs>
                    <g transform="rotate(-24 12 12)">
                        <path
                            d="M2.2 12 A9.8 3.6 0 0 1 21.8 12"
                            fill="none"
                            stroke="#9677FF"
                            stroke-width="1.8"
                            stroke-linecap="round"
                        />
                        <circle
                            cx="12"
                            cy="12"
                            r="5.9"
                            fill="#B9A4FF"
                            mask="url(#offline-planet-cut)"
                        />
                        <path
                            d="M2.2 12 A9.8 3.6 0 0 0 21.8 12"
                            fill="none"
                            stroke="#9677FF"
                            stroke-width="1.8"
                            stroke-linecap="round"
                        />
                        <circle cx="21.2" cy="10.5" r="1.3" fill="#ECE9FF" />
                    </g>
                </svg>
                cellestial
            </span>
        </header>
        <main class="block">
            <svg
                class="icon"
                width="32"
                height="32"
                viewBox="0 0 16 16"
                fill="none"
                aria-hidden="true"
            >
                <circle cx="8" cy="8" r="6.3" stroke="currentColor" stroke-width="1.3" />
                <path
                    d="M8 4.9v3.6M8 11v.1"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                />
            </svg>
            <h1>Нет подключения к интернету</h1>
            <p>Проверьте подключение и попробуйте снова</p>
            <!-- пустой href — исходный адрес: страница работает без скриптов -->
            <a class="button" href="">Повторить</a>
        </main>
    </body>
</html>
